<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Her Lens · 你的游戏人格</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root {
    --bg: #f3eff7;
    --surface: rgba(250, 247, 253, 0.55);
    --surface2: rgba(246, 242, 250, 0.60);
    --text: #3d3546;
    --text2: #665c72;
    --text3: #8c8099;
    --border: rgba(213, 207, 224, 0.35);
    --accent: #9b8acd;
    --accent2: #7e6fa0;
    --accent-light: rgba(155, 138, 189, 0.12);
    --accent-glow: rgba(155, 138, 189, 0.25);
    --shadow: 0 8px 32px rgba(60, 30, 80, 0.12);
    --shadow-lg: 0 16px 64px rgba(60, 30, 80, 0.20);
    --logo-gradient: linear-gradient(135deg, #9b8acd 0%, #7e6fa0 100%);
    --radius: 16px;
    --radius-sm: 10px;
    --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', -apple-system, sans-serif;
    color: var(--text); background: var(--bg);
    background-image: radial-gradient(ellipse at 15% 10%, rgba(155,138,205,0.10) 0%, transparent 45%), radial-gradient(ellipse at 85% 90%, rgba(126,111,160,0.08) 0%, transparent 50%);
    min-height: 100vh; line-height: 1.6; overflow-x: hidden;
}
#app { max-width: 640px; margin: 0 auto; padding: 1.5rem 1rem 3rem; min-height: 100vh; display: flex; flex-direction: column; }
.logo-area { text-align: center; margin-bottom: 1.5rem; }
.logo-area .logo { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 1.1rem; font-weight: 700; color: var(--accent2); letter-spacing: 0.02em; }
.logo-area .logo .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--logo-gradient); }
.screen { display: none; flex: 1; flex-direction: column; animation: fadeInUp 0.5s ease; }
.screen.active { display: flex; }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }


/* ===== 场景化版本新增样式 ===== */

/* 章节主题色 */
body.chapter-0 { --chapter-accent: #9b8acd; --chapter-glow: rgba(155,138,189,0.18); }
body.chapter-1 { --chapter-accent: #c8923a; --chapter-glow: rgba(200,146,58,0.18); }
body.chapter-2 { --chapter-accent: #6f9b6f; --chapter-glow: rgba(111,155,111,0.18); }
body.chapter-3 { --chapter-accent: #c87ea0; --chapter-glow: rgba(200,126,160,0.18); }
body.chapter-4 { --chapter-accent: #7a6fa0; --chapter-glow: rgba(122,111,160,0.18); }
body.chapter-5 { --chapter-accent: #b83d3d; --chapter-glow: rgba(184,61,61,0.18); }

body {
    transition: background-image 0.8s ease, --chapter-accent 0.8s ease;
}

/* 章节标题卡 */
#screenChapterTitle {
    justify-content: center; align-items: center; text-align: center;
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 100;
    background: rgba(20, 15, 30, 0.94);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
}
.chapter-number {
    font-size: 0.8rem; letter-spacing: 0.35em;
    color: rgba(255,255,255,0.45);
    text-transform: uppercase; margin-bottom: 1rem;
    font-weight: 500;
}
.chapter-title-main {
    font-size: 2.4rem; font-weight: 700;
    margin-bottom: 0.8rem;
    background: linear-gradient(135deg, #e8dff5 0%, #ffffff 50%, #d4c8e8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 0.05em;
}
.chapter-title-sub {
    font-size: 0.95rem; color: rgba(255,255,255,0.55);
    font-style: italic; line-height: 1.7;
    max-width: 300px; margin: 0 auto;
}
@keyframes chapterFadeIn {
    0% { opacity: 0; transform: scale(0.9); }
    100% { opacity: 1; transform: scale(1); }
}

/* 选项卡片 */
.option-card {
    background: var(--surface);
    backdrop-filter: blur(20px);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.9rem 1.1rem;
    margin-bottom: 0.65rem;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex; gap: 0.8rem;
    align-items: flex-start;
    position: relative;
    overflow: hidden;
}
.option-card::before {
    content: ''; position: absolute;
    left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--chapter-accent, var(--accent));
    transform: scaleY(0);
    transition: transform 0.3s ease;
    transform-origin: bottom;
}
.option-card:hover {
    border-color: var(--chapter-accent, var(--accent));
    background: rgba(255,255,255,0.65);
    transform: translateX(4px);
    box-shadow: 0 4px 16px var(--chapter-glow, var(--accent-glow));
}
.option-card:hover::before { transform: scaleY(1); }
.option-card.selected {
    border-color: var(--chapter-accent, var(--accent));
    background: linear-gradient(135deg, var(--chapter-glow, var(--accent-light)), rgba(255,255,255,0.5));
    box-shadow: 0 4px 20px var(--chapter-glow, var(--accent-glow));
    transform: translateX(4px);
}
.option-card.selected::before { transform: scaleY(1); }
.option-icon {
    font-size: 1.25rem; flex-shrink: 0;
    width: 30px; text-align: center;
    margin-top: 0.1rem;
}
.option-text {
    flex: 1; font-size: 0.92rem;
    color: var(--text); line-height: 1.6;
}

/* 场景叙事引导 */
.scene-narrative {
    font-size: 1.05rem;
    color: var(--text);
    line-height: 1.85;
    margin-bottom: 1.5rem;
    padding: 1rem 1.2rem;
    background: var(--chapter-glow, var(--accent-light));
    border-left: 3px solid var(--chapter-accent, var(--accent));
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}

/* 进度区域 */
.quiz-header { margin-bottom: 1.3rem; }
.chapter-indicator {
    font-size: 0.72rem;
    color: var(--chapter-accent, var(--accent));
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 0.25rem;
}
.chapter-name {
    font-size: 0.9rem;
    color: var(--text2);
    margin-bottom: 0.5rem;
}

/* 冒险轨迹 */
.adventure-trail {
    display: flex; gap: 0.25rem;
    justify-content: center; flex-wrap: wrap;
    margin: 1rem 0 0.3rem;
    padding: 0 0.5rem;
}
.trail-node {
    width: 24px; height: 24px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.65rem;
    background: var(--surface);
    border: 1px solid var(--border);
    opacity: 0.55;
    transition: all 0.3s ease;
}
.trail-node:hover {
    opacity: 1;
    transform: scale(1.25);
    z-index: 2;
}

/* 封面 */
#screenIntro { justify-content: center; align-items: center; text-align: center; padding: 2rem 1rem; }
.intro-icon { width: 100px; height: 100px; margin: 0 auto 2rem; background: var(--logo-gradient); border-radius: 28px; display: flex; align-items: center; justify-content: center; font-size: 3rem; box-shadow: 0 12px 40px var(--accent-glow); animation: float 3s ease-in-out infinite; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
#screenIntro h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 0.5rem; background: var(--logo-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
#screenIntro .subtitle { font-size: 1rem; color: var(--text2); margin-bottom: 0.6rem; line-height: 1.7; }
#screenIntro .sub-hint { font-size: 0.85rem; color: var(--text3); margin-bottom: 2rem; line-height: 1.6; }
.intro-features { display: flex; gap: 0.6rem; margin-bottom: 2.5rem; flex-wrap: wrap; justify-content: center; }
.intro-feature { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 0.4rem 0.9rem; font-size: 0.8rem; color: var(--text2); backdrop-filter: blur(10px); }

/* 按钮 */
.btn-primary { background: var(--logo-gradient); color: #fff; border: none; padding: 0.9rem 2.5rem; border-radius: 30px; font-size: 1.05rem; font-weight: 600; cursor: pointer; transition: var(--transition); box-shadow: 0 6px 20px var(--accent-glow); letter-spacing: 0.03em; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px var(--accent-glow); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.btn-secondary { background: transparent; color: var(--accent2); border: 1px solid var(--border); padding: 0.7rem 1.5rem; border-radius: 30px; font-size: 0.9rem; cursor: pointer; transition: var(--transition); }
.btn-secondary:hover { background: var(--accent-light); border-color: var(--accent); }

/* 测试页 */
#screenQuiz { padding-top: 0.5rem; }
.progress-bar { height: 4px; background: var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 0.4rem; }
.progress-bar .fill { height: 100%; background: var(--logo-gradient); border-radius: 4px; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
.progress-text { font-size: 0.8rem; color: var(--text3); margin-bottom: 2rem; text-align: right; }
.question-card { background: var(--surface); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem 1.5rem; box-shadow: var(--shadow); margin-bottom: 1.5rem; transition: opacity 0.3s, transform 0.3s; }
.question-card.switching { opacity: 0; transform: translateX(-20px); }
.question-text { font-size: 0.9rem; font-weight: 400; color: var(--text3); margin-bottom: 1.2rem; line-height: 1.5; }
.question-hint { font-size: 0.9rem; color: var(--text3); margin-bottom: 1.2rem; }
.scale-labels { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text3); margin-bottom: 0.8rem; padding: 0 0.2rem; }
.scale-options { display: flex; justify-content: space-between; gap: 0.4rem; }
.scale-opt { flex: 1; aspect-ratio: 1; max-width: 48px; border-radius: 50%; border: 2px solid var(--border); background: var(--surface); cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 600; color: var(--text3); }
.scale-opt:hover { border-color: var(--accent); color: var(--accent); transform: scale(1.1); }
.scale-opt.selected { background: var(--logo-gradient); border-color: transparent; color: #fff; transform: scale(1.15); box-shadow: 0 4px 16px var(--accent-glow); }
.scale-opt .emoji { font-size: 1.05rem; display: none; }
.scale-opt.selected .emoji { display: block; }
.scale-opt.selected .num { display: none; }
.quiz-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem; }

/* MBTI 输入 */
#screenMBTI { justify-content: center; align-items: center; padding: 1rem 0; }
.mbti-title { font-size: 1.3rem; font-weight: 700; color: var(--text); margin-bottom: 0.5rem; text-align: center; }
.mbti-subtitle { font-size: 0.9rem; color: var(--text2); margin-bottom: 1.5rem; text-align: center; line-height: 1.6; }
.mbti-group { margin-bottom: 1rem; width: 100%; }
.mbti-group-label { font-size: 0.75rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.4rem; padding-left: 0.2rem; }
.mbti-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
.mbti-btn { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 0.6rem 0.3rem; text-align: center; cursor: pointer; transition: var(--transition); font-size: 0.85rem; font-weight: 600; color: var(--text2); }
.mbti-btn:hover { border-color: var(--accent); color: var(--accent); }
.mbti-btn.selected { background: var(--logo-gradient); border-color: transparent; color: #fff; box-shadow: 0 4px 12px var(--accent-glow); }
.mbti-btn-fullname { font-size: 0.68rem; color: var(--text3); margin-top: 0.1rem; font-weight: 400; }
.mbti-btn.selected .mbti-btn-fullname { color: rgba(255,255,255,0.8); }
.mbti-actions { display: flex; gap: 0.8rem; margin-top: 1.5rem; justify-content: center; }

/* 加载 */
#screenLoading { justify-content: center; align-items: center; text-align: center; }
.loading-icon { width: 80px; height: 80px; margin: 0 auto 2rem; border: 4px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#screenLoading p { color: var(--text2); font-size: 1.05rem; }
.loading-dots span { display: inline-block; animation: dotPulse 1.4s infinite; }
.loading-dots span:nth-child(2) { animation-delay: 0.2s; }
.loading-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dotPulse { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }

/* 结果 */
#screenResult { padding-bottom: 2rem; }
.result-header { text-align: center; margin-bottom: 1.5rem; }
.result-header .label { font-size: 0.82rem; color: var(--text3); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.4rem; }
.result-card { background: var(--surface); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem 1.5rem; box-shadow: var(--shadow-lg); margin-bottom: 1.5rem; text-align: center; position: relative; overflow: hidden; }
.result-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, var(--accent-glow) 0%, transparent 60%); opacity: 0.5; animation: rotate 20s linear infinite; }
@keyframes rotate { to { transform: rotate(360deg); } }
.result-card > * { position: relative; z-index: 1; }
.type-icon { width: 96px; height: 96px; margin: 0 auto 1rem; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-size: 3rem; box-shadow: 0 8px 24px var(--accent-glow); }
.type-class { font-size: 0.85rem; font-weight: 600; color: var(--text3); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 0.3rem; }
.type-name { font-size: 1.8rem; font-weight: 700; margin-bottom: 0.3rem; }
.type-tagline { font-size: 1rem; color: var(--text2); margin-bottom: 1.2rem; line-height: 1.6; font-style: italic; }
.type-description { font-size: 0.95rem; color: var(--text2); line-height: 1.85; text-align: left; padding: 0.5rem 0.8rem; }
.type-description p { margin: 0 0 1.1rem 0; text-indent: 0; }
.type-description p:first-child { font-size: 1.05rem; color: var(--text); font-weight: 500; margin-bottom: 1.2rem; }
.type-description p:last-child { margin-bottom: 0; }

/* 分析区 */
.analysis-section { margin-top: 1.5rem; }
.analysis-section h4 { font-size: 0.88rem; color: var(--accent2); margin-bottom: 0.8rem; font-weight: 600; }
.trait-list { list-style: none; padding: 0; }
.trait-list li { font-size: 0.88rem; color: var(--text2); line-height: 1.7; padding-left: 1.2rem; position: relative; margin-bottom: 0.3rem; }
.trait-list li::before { content: '\2726'; position: absolute; left: 0; color: var(--accent); font-size: 0.7rem; top: 0.15rem; }
.social-post-card { background: linear-gradient(135deg, var(--accent-light), rgba(155,138,189,0.05)); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 1rem 1.2rem; margin-top: 0.8rem; font-size: 0.88rem; color: var(--text2); line-height: 1.7; font-style: italic; }
.social-post-card .post-label { font-size: 0.72rem; color: var(--text3); font-style: normal; margin-bottom: 0.3rem; letter-spacing: 0.05em; }

/* 互补职业 */
.comp-area { margin: 1.5rem 0; }
.comp-area h3 { font-size: 0.88rem; color: var(--text3); margin-bottom: 0.8rem; font-weight: 500; }
.comp-card { display: flex; gap: 0.8rem; background: linear-gradient(135deg, var(--accent-light), rgba(155,138,189,0.05)); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 1rem; align-items: flex-start; }
.comp-icon { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0; }
.comp-info { flex: 1; }
.comp-label { font-size: 0.75rem; color: var(--text3); margin-bottom: 0.15rem; }
.comp-name { font-size: 1rem; font-weight: 600; color: var(--text); }
.comp-reason { font-size: 0.82rem; color: var(--text2); margin-top: 0.2rem; line-height: 1.5; }

/* MBTI 适配 */
.mbti-result-area { margin: 1.5rem 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; }
.mbti-result-area h3 { font-size: 0.88rem; color: var(--text3); margin-bottom: 1rem; font-weight: 500; }
.mbti-compat-header { display: flex; align-items: baseline; gap: 0.5rem; margin-bottom: 0.8rem; }
.mbti-compat-score { font-size: 2.2rem; font-weight: 700; background: var(--logo-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.mbti-compat-label { font-size: 0.85rem; color: var(--text3); }
.mbti-reason { font-size: 0.88rem; color: var(--text2); line-height: 1.7; margin-bottom: 1rem; }
.mbti-dimension { padding: 0.6rem 0; }
.mbti-dim-title { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; font-weight: 600; color: var(--accent2); margin-bottom: 0.5rem; }
.mbti-dim-badge { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 6px; background: var(--accent-light); color: var(--accent); font-size: 0.72rem; font-weight: 700; }
.mbti-dim-text { margin: 0; font-size: 0.86rem; line-height: 1.75; color: var(--text2); }
.mbti-dim-divider { height: 1px; background: var(--border); margin: 0.3rem 0; }
.mbti-trait-item { display: flex; gap: 0.6rem; margin-bottom: 0.5rem; align-items: flex-start; }
.mbti-trait-letter { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-light); color: var(--accent); font-size: 0.85rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.mbti-trait-text { font-size: 0.82rem; color: var(--text2); line-height: 1.6; }

/* ===== 人格光谱 + Top3特质 ===== */
.spectrum-section { margin: 1.3rem 0; }
.spectrum-section h3, .trait-section h3 {
  font-size: 1.05rem; font-weight: 600; margin-bottom: 1rem;
  display: flex; align-items: center; gap: 0.4rem;
}
.spectrum-section h3::before, .trait-section h3::before {
  content: ''; width: 4px; height: 18px; border-radius: 2px;
  background: var(--logo-gradient);
}
.spectrum-list { display: flex; flex-direction: column; gap: 1rem; }
.spectrum-item { padding: 0 0.2rem; }
.spectrum-labels {
  display: flex; justify-content: space-between;
  margin-bottom: 0.5rem; font-size: 0.85rem; font-weight: 500;
}
.spectrum-left { color: var(--spectrum-left, #c87ea0); }
.spectrum-right { color: var(--spectrum-right, #6f9b6f); }
.spectrum-bar {
  height: 12px; border-radius: 999px;
  background: var(--surface-muted, #f3eff7);
  position: relative; overflow: visible;
}
.spectrum-marker {
  position: absolute; top: 50%;
  width: 22px; height: 22px; border-radius: 50%;
  background: #fff;
  border: 3px solid var(--chapter-accent, var(--accent));
  transform: translate(-50%, -50%);
  box-shadow: 0 2px 10px var(--chapter-glow, var(--accent-glow));
  transition: left 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 2;
}
.spectrum-fill-left {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: linear-gradient(90deg, var(--spectrum-left, #c87ea0), var(--chapter-accent, var(--accent)));
  border-radius: 999px 0 0 999px;
  opacity: 0.5;
}
.spectrum-fill-right {
  position: absolute; right: 0; top: 0; bottom: 0;
  background: linear-gradient(90deg, var(--chapter-accent, var(--accent)), var(--spectrum-right, #6f9b6f));
  border-radius: 0 999px 999px 0;
  opacity: 0.35;
}
.spectrum-desc {
  font-size: 0.78rem; color: var(--text3);
  line-height: 1.5; text-align: center;
  margin-top: 0.5rem; font-style: italic;
}

/* Top3特质卡 */
.trait-section { margin: 1.5rem 0; }
.trait-cards { display: flex; flex-direction: column; gap: 0.6rem; }
.trait-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 0.9rem 1rem;
  display: flex; gap: 0.8rem;
  align-items: flex-start;
  transition: all 0.25s ease;
  opacity: 0; transform: translateY(10px);
  animation: traitCardIn 0.5s ease forwards;
}
.trait-card:nth-child(1) { animation-delay: 0.1s; }
.trait-card:nth-child(2) { animation-delay: 0.25s; }
.trait-card:nth-child(3) { animation-delay: 0.4s; }
@keyframes traitCardIn {
  to { opacity: 1; transform: translateY(0); }
}
.trait-card:hover {
  transform: translateX(4px);
  border-color: var(--chapter-accent, var(--accent));
  box-shadow: 0 4px 16px var(--chapter-glow, var(--accent-glow));
}
.trait-card-icon {
  width: 40px; height: 40px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;

        description: '地图上那片灰色的区域，是你今晚的失眠原因。不填满，睡不着。\n\n别人急着推主线，你在路边捡蘑菇。别人打完Boss直奔下一个区域，你在Boss房里翻箱倒柜，看看有没有漏掉的宝箱。对你来说，游戏的目标不是通关。是那些藏起来的东西。\n\n那个藏在瀑布后面的洞穴。那棵树上挂着的宝箱。那个需要特定时间才会出现的NPC。那朵只在夜里开花的植物。这些才是你真正追求的东西。\n\n你对细节和完整性有很高的要求。你喜欢把东西按秩序排列好，把没做完的事情做完。你最难受的就是"事情没做完"的感觉。地图没填满、收集品没找齐、隐藏剧情没触发——这些都会让你浑身难受。\n\n你喜欢把事情做成，喜欢看到结果，喜欢那种"全部搞定"的满足感。对细节的执念加上完成的动力，就是你常说的那句话："不弄完我睡不着。"\n\n你从小就是这样。翻开石头看看下面有什么虫子。钻进树林看看尽头在哪里。爬到楼顶看看整个城市长什么样。对"隐藏的事物"的好奇心，是刻在你骨子里的本能。\n\n有人说你闲的。你知道不是闲。是直觉在告诉你——那里，一定有什么。你怕错过。比怕失败，还怕错过。一个探索者放走了发现，比什么都难受。\n\n你选游戏的标准很明确：地图够不够大？隐藏要素够不够多？有没有那种"奖励探索者"的设计？\n\n路边的一朵小花。一封不起眼的信。一个没有任务指引的角落。这些东西，只有你这样的人，才找得到。\n\n最珍贵的宝藏，从来都不在主路上。',

        complementary: { type: 'ranger', reason: '猎人追求收集完整，游侠追求自由随性。一个把世界翻个底朝天，一个随心所欲四处游荡——你们一起探索，既有目标又有惊喜。' },

        tagline: '「风往哪吹，我就往哪走」',
        description: '没有目的地。只有方向。风往哪吹，你就往哪走。\n\n任务列表？不看。攻略？不搜。你玩游戏的方式很简单：走到哪算哪。左边那条小路看起来挺有意思的，去看看。远处那座山不知道能不能爬上去，试试。反正也没人催你。\n\n你讨厌被安排。\n\n别人的游戏节奏是"接任务→做任务→交任务"，你的节奏是"今天天气好，去湖边逛逛"。这不是没有目标。是你的字典里，从来就没有"应该"这两个字。\n\n你总是被各种可能性吸引，总想试试新的路，总想看看那边有什么。你最受不了的就是"按部就班"。你需要新鲜感，需要意外，需要"说不定转角有什么"的期待感。\n\n你喜欢活在当下，喜欢用身体去感受世界，喜欢"走着瞧"的随性。对可能性的好奇加上立刻出发的行动力，就是你那种"想到哪去到哪"的游侠气质。\n\n你选游戏的标准很简单：够不够自由？能不能想干嘛干嘛？有没有一条"不做主线也能玩得很开心"的路？因为你要的不是一场被安排好的旅行。是一场真正的冒险。\n\n你不看攻略，不是因为攻略不好用，是因为你想拥有完全属于自己的体验：第一次看见那片海，第一次走进那座城，第一次在转角撞见那个人。你守护的不是效率。是"第一次"的那种纯粹。\n\n现实里的你，大概也是个不喜欢被安排的人。别人画好的路你走着别扭。自己绕的弯路，反而觉得处处是风景。\n\n你不是没有目标。你只是相信，最好的故事，永远在计划之外。\n\n你最珍贵的战利品，从来都不是什么装备和等级。是那一路自由自在的风。',

        description: '你的手指有记忆。\n\nBoss的第一招挥过来的时候，你甚至不用想。手指自己就动了。闪避、反击、连招——行云流水，像跳舞。你的身体里，住着节奏。每一次闪避都踩在节拍上。每一套连招都像一段旋律。每一次出手，都是精准的艺术。\n\n你不怕失败。死了就再来。因为每一次倒下，你都离完美更近一步。你追求的不是"赢了"。是"我做到了"。那一刻的满足感，不是来自打败了谁，而是来自你对自己能力的确认——原来我可以做到这种程度。\n\n你对当下的感知力极强。手速、反应、节奏感都天生比别人好。你的身体和感官是你认识世界的主要方式。你擅长"用身体思考"。\n\n你喜欢拆解问题，喜欢搞懂原理，喜欢把一件事做到极致精准。身体的敏锐度加上逻辑上的精准感，就是那种"人剑合一"的流畅体验。\n\n有人说你手速快。你知道不是手速的问题。是专注。当你全神贯注的时候，整个世界就只剩下屏幕上那一小块区域。没有杂念，没有干扰。只有你，和你的操作。\n\n你的世界里，没有"差不多"。只有"刚好"。刚好在那一秒闪避。刚好在那一瞬间反击。刚好卡着那个极限，打出最漂亮的一击。\n\n你选动作游戏的标准很挑剔：操作手感够不够好？连招够不够爽？有没有那种"人剑合一"的流畅感？因为你要的不是"用数值碾压"。是"用技术赢"。\n\n每一次闪避都像一次呼吸。每一套连招都像一段舞蹈。你和游戏之间，有一种只有操作才能表达的默契。\n\n你每一次的完美操作，都是一次无声的宣言——我的极限，由我自己定义。',

function renderBranchPath() {
    var pathArea = document.getElementById('branchPath');
    if (!pathArea) return;
    
    var branches = [
        { key: 'companion', name: '同伴线', icon: '👭', values: {
            close: '亲密同行型——你主动靠近，把她当朋友',
            light: '礼貌距离型——你保持客气，不远不近',
            observe: '观察判断型——你先观察，再决定信不信任',
            solo: '独来独往型——你更喜欢一个人，自在'
        }},
        { key: 'choice', name: '抉择线', icon: '⚖️', values: {
            power: '力量优先型——你抓住机会，代价以后再说',
            research: '谨慎研究型——你先搞清楚代价，再做决定',
            safe: '安全第一型——你选择稳妥，不冒不必要的险',
            explore: '寻找第三路型——你相信总有别的办法'
        }},
        { key: 'finale', name: '终局线', icon: '🌅', values: {
            prepare: '万全准备型——你把一切调整到最佳状态',
            farewell: '珍重告别型——你去和每个人好好说再见',
            tour: '故地重游型——你把走过的路再走一遍',
            rush: '直奔终点型——你迫不及待想知道结局'
        }}
    ];
    
    var html = '';
    branches.forEach(function(b) {
        var val = branchState[b.key];
        var desc = val && b.values[val] ? b.values[val] : '未选择';
        html += '<div class="branch-path-item">';
        html += '<div class="branch-path-icon">' + b.icon + '</div>';
        html += '<div class="branch-path-body">';
        html += '<div class="branch-path-name">' + b.name + '</div>';
        html += '<div class="branch-path-desc">' + desc + '</div>';
        html += '</div></div>';
    });
    
    pathArea.innerHTML = html;
}


// 渲染最像的游戏人物
function renderCharacterMatch(careerKey) {
    var charArea = document.getElementById('characterMatch');
    if (!charArea || !gameCharacters[careerKey]) return;
    
    var chars = gameCharacters[careerKey];
    var primary = chars[0];
    
    var html = '<div class="char-match-card">';
    // 主角色（图左文右）
    html += '<div class="char-match-primary">';
    if (primary.image) {
        html += '<div class="char-match-portrait-wrap">';
        html += '<img class="char-match-portrait" src="char-images/' + primary.image + '" alt="' + primary.name + '" onerror="this.style.display=\'none\';this.parentElement.style.display=\'none\'">';
        html += '</div>';
    }
    html += '<div class="char-match-info">';
    html += '<div class="char-match-header"><span class="char-match-name">' + primary.name + '</span><span class="char-match-game">· ' + primary.game + '</span></div>';
    html += '<div class="char-match-desc">' + primary.desc + '</div>';
    if (primary.matchReason) {
        html += '<div class="char-match-reason">' + primary.matchReason + '</div>';
    }
    html += '</div>';
    html += '</div>';
    
    // 次角色（图右文左，通过 flex-direction: row-reverse 实现）
    if (chars.length > 1) {
        html += '<div class="char-match-secondary-title">也像</div>';
        for (var i = 1; i < chars.length; i++) {
            var sub = chars[i];
            html += '<div class="char-match-secondary">';
            if (sub.image) {
                html += '<div class="char-match-portrait-wrap">';
                html += '<img class="char-match-portrait" src="char-images/' + sub.image + '" alt="' + sub.name + '" onerror="this.style.display=\'none\';this.parentElement.style.display=\'none\'">';
                html += '</div>';
            }
            html += '<div class="char-match-info">';
            html += '<div class="char-match-header"><span class="char-match-name">' + sub.name + '</span><span class="char-match-game">· ' + sub.game + '</span></div>';
            html += '<div class="char-match-desc">' + sub.desc + '</div>';
            if (sub.matchReason) {
                html += '<div class="char-match-reason">' + sub.matchReason + '</div>';
            }
            html += '</div>';
            html += '</div>';
        }
    }
    html += '</div>';
    
    charArea.innerHTML = html;
}

function generateSoulDiagnosis(primaryType) {
    var t = playerTypes[primaryType];
    // 获取得分绝对值最高的4个维度
    var sortedDims = Object.entries(scores)
        .map(function(entry) { return { key: entry[0], val: entry[1] }; })
        .filter(function(d) { return quotePool[d.key]; })
        .sort(function(a, b) { return Math.abs(b.val) - Math.abs(a.val); });

    var topDims = sortedDims.slice(0, 4);
    var html = '<div class="soul-diagnosis">';
    html += '<div class="diagnosis-header">🎮 你的玩家灵魂诊断书</div>';
    html += '<div class="diagnosis-subtitle">—— ' + t.name + ' ' + t.icon + '</div>';
    html += '<div class="diagnosis-quotes">';

    topDims.forEach(function(d) {
        var pool = quotePool[d.key];
        var level = d.val >= 1.5 ? 'high' : (d.val <= -1.5 ? 'low' : 'mid');
        var quotes = pool[level];
        var quote = quotes[Math.floor(Math.random() * quotes.length)];
        html += '<div class="diagnosis-quote">' + quote + '</div>';
    });

    html += '</div></div>';
    return html;
}

// 获取指定题目的实际选项数据（处理分支变体题）
function getQuestionOpts(q) {
    if (!q) return [];
    // 如果是分支变体题，返回对应分支的选项
    if (q.isBranch && q.branchOf && q.variants) {
        var branchVal = branchState[q.branchOf];
        if (branchVal && q.variants[branchVal]) {
            return q.variants[branchVal].options || [];
        }
        // 分支状态还没设置，返回第一个变体的选项作为默认
        var firstKey = Object.keys(q.variants)[0];
        if (firstKey && q.variants[firstKey]) {
            return q.variants[firstKey].options || [];
        }
        return [];
    }
    return q.options || [];
}

// 获取当前题目的实际数据（处理分支题）
function getCurrentQuestion() {
    var q = scenarioQuestions[currentQuestion];
    if (!q) return null;
    // 如果是分支题，返回对应分支的变体
    if (q.isBranch && q.branchOf && q.variants) {
        var branchKey = q.branchOf;
        var branchVal = branchState[branchKey];
        if (branchVal && q.variants[branchVal]) {
            var variant = q.variants[branchVal];
            return {
                chapter: q.chapter,
                scene: variant.scene,
                question: variant.question,
                options: variant.options,
                isBranch: true
            };
        }
        // 分支状态还没设置，返回第一个变体作为默认
        var firstKey = Object.keys(q.variants)[0];
        var firstVariant = q.variants[firstKey];
        return {
            chapter: q.chapter,
            scene: firstVariant.scene,
            question: firstVariant.question,
            options: firstVariant.options,
            isBranch: true
        };
    }
    return q;
}

function showChapterTitle(chapterIdx, callback) {

    // 切换章节主题色
    document.body.className = 'chapter-' + chapterIdx;

    var screen = document.getElementById('screenChapterTitle');

    card.style.animation = 'none';
    card.offsetHeight;
    card.style.animation = 'chapterFadeIn 1.2s ease';

    showScreen('screenChapterTitle');

    setTimeout(function() {
        if (callback) callback();
    }, 1800);
}

function getTotalQuestions() {
    return scenarioQuestions.length;
}

function renderQuestion() {
    var q = getCurrentQuestion();
    if (!q) return;
    var card = document.getElementById('questionCard');

    // 更新章节指示器
    var ch = chapters[q.chapter];
    document.getElementById('chapterIndicator').textContent = ch.num;
    document.getElementById('chapterName').textContent = ch.name;
    document.getElementById('progressNum').textContent = currentQuestion + 1;
    document.getElementById('totalNum').textContent = getTotalQuestions();
    document.getElementById('progressFill').style.width = ((currentQuestion + 1) / getTotalQuestions() * 100) + '%';

    // 章节主题色
    if (q.chapter !== currentChapter) {
        currentChapter = q.chapter;
        document.body.className = 'chapter-' + q.chapter;
    }

    // 构建选项
    var optionsHTML = '';
    q.options.forEach(function(opt, i) {
        var selected = answers[currentQuestion] === i ? 'selected' : '';
        optionsHTML += '<div class="option-card '+selected+'" data-index="'+i+'" onclick="selectOption('+i+')"><div class="option-icon">'+opt.icon+'</div><div class="option-text">'+opt.text+'</div></div>';
    });

    var questionHTML = q.question ? '<div class="question-text">'+q.question+'</div>' : '';

    card.innerHTML =
        '<div class="scene-narrative">'+q.scene+'</div>' +
        questionHTML +
        '<div style="margin-top:1.2rem">' + optionsHTML + '</div>';

    // 导航按钮
    document.getElementById('btnPrev').style.visibility = currentQuestion > 0 ? 'visible' : 'hidden';
    document.getElementById('btnNext').disabled = answers[currentQuestion] === null;
    document.getElementById('btnNext').textContent = currentQuestion === getTotalQuestions() - 1 ? '揭晓答案 ✨' : '下一题 →';
}

var _autoNextTimer = null;

function selectOption(idx) {
    // 取消之前的自动跳转定时器（防止快速切换选项时重复触发）
    if (_autoNextTimer) {
        clearTimeout(_autoNextTimer);
        _autoNextTimer = null;
    }

    answers[currentQuestion] = idx;

    // 如果是分支点题目，设置分支状态
    var rawQ = scenarioQuestions[currentQuestion];
    if (rawQ && rawQ.branchKey && rawQ.branchOptions) {
        var opt = rawQ.options[idx];
        if (opt && opt.branchValue) {
            branchState[rawQ.branchKey] = opt.branchValue;
        }
    }

    var opts = document.querySelectorAll('.option-card');
    opts.forEach(function(o, i) {
        o.classList.remove('selected');
        if (i === idx) {
            o.classList.add('selected');
            o.classList.add('selecting');
            setTimeout(function() { o.classList.remove('selecting'); }, 400);
        }
    });

    document.getElementById('btnNext').disabled = false;

    // 自动进入下一题（给选中动画留 450ms 展示时间）
    _autoNextTimer = setTimeout(function() {
        _autoNextTimer = null;
        nextQuestion();
    }, 450);
}

function nextQuestion() {
    if (currentQuestion < getTotalQuestions() - 1) {
        var card = document.getElementById('questionCard');
        card.classList.add('switching');
        setTimeout(function() {
            currentQuestion++;

            var nextQ = scenarioQuestions[currentQuestion];
            var prevQ = scenarioQuestions[currentQuestion - 1];

            if (nextQ.chapter !== prevQ.chapter) {
                // 进入新章节 → 显示章节标题卡
                showChapterTitle(nextQ.chapter, function() {
                    showScreen('screenQuiz');
                    renderQuestion();
                    card.classList.remove('switching');
                });
            } else {
                renderQuestion();
                card.classList.remove('switching');
            }
        }, 250);
    } else {
        calculateCareerScores();
        pendingResult = determineCareerTypes();
        showScreen('screenMBTI');
        renderMBTIGrid();
    }
}

function prevQuestion() {
    if (currentQuestion > 0) {
        var card = document.getElementById('questionCard');
        card.classList.add('switching');
        setTimeout(function() {
            currentQuestion--;
            renderQuestion();
            card.classList.remove('switching');
        }, 250);
    }
}

function calculateCareerScores() {
    resetCareerScores();
    scenarioQuestions.forEach(function(q, i) {
        var optIdx = answers[i];
        if (optIdx === null || optIdx === undefined) return;
        var opts = getQuestionOpts(q);
        var opt = opts[optIdx];
        if (!opt || !opt.scores) return;
        Object.keys(opt.scores).forEach(function(career) {
            if (careerScores[career] !== undefined) {
                careerScores[career] += opt.scores[career];
            }
        });
    });
}

function determineCareerTypes() {
    var sorted = Object.entries(careerScores).sort(function(a, b) { return b[1] - a[1]; });
    var primary = sorted[0][0], ps = sorted[0][1];
    var secondary = null, sp = 0;
    if (sorted.length > 1 && sorted[1][1] > 0) {
        secondary = sorted[1][0];
        sp = Math.min(92, Math.max(15, Math.round((sorted[1][1] / ps) * 100)));
    }
    syncDimensionScores();
    return { primary: primary, secondary: secondary, secondaryPct: sp };
}

function syncDimensionScores() {
    Object.keys(scores).forEach(function(k) { scores[k] = 0; });
    var maxScore = 0;
    Object.keys(careerScores).forEach(function(career) {
        if (careerScores[career] > maxScore) maxScore = careerScores[career];
    });
    if (maxScore === 0) maxScore = 1;

    Object.keys(careerScores).forEach(function(career) {
        var weight = careerScores[career] / maxScore;
        var dims = careerToDims[career] || {};
        Object.keys(dims).forEach(function(dim) {
            scores[dim] = (scores[dim] || 0) + dims[dim] * weight;
        });
    });

    var dimMax = 0;
    Object.keys(scores).forEach(function(k) { if (scores[k] > dimMax) dimMax = scores[k]; });
    if (dimMax > 0) {
        Object.keys(scores).forEach(function(k) {
            scores[k] = (scores[k] / dimMax) * 5 - 1;
        });
    }
}

function calcSpectrumPosition(spec) {
    var leftScore = 0, rightScore = 0;
    Object.keys(spec.left.careers).forEach(function(c) {
        leftScore += (careerScores[c] || 0) * spec.left.careers[c];
    });
    Object.keys(spec.right.careers).forEach(function(c) {
        rightScore += (careerScores[c] || 0) * spec.right.careers[c];
    });
    var total = leftScore + rightScore;
    if (total === 0) return 50;
    // 左侧得分越高，位置越靠左（百分比越小）
    var ratio = leftScore / total;
    return Math.max(8, Math.min(92, Math.round(ratio * 100)));
}

function getSpectrumDesc(spec, pos) {
    if (pos < 25) return spec.farLeft;       // 极端左
    if (pos < 42) return spec.leanLeft;      // 偏左
    if (pos <= 58) return spec.mid;          // 中间
    if (pos < 75) return spec.leanRight;     // 偏右
    return spec.farRight;                    // 极端右
}

function renderSpectrum() {
    var list = document.getElementById('spectrumList');
    if (!list) return;

    spectrums.forEach(function(spec, i) {
        var pos = calcSpectrumPosition(spec);

        html += '<div class="spectrum-item" style="--spectrum-left:'+spec.left.color+';--spectrum-right:'+spec.right.color+'">';
        html += '<div class="spectrum-labels"><span class="spectrum-left">'+spec.left.label+'</span><span class="spectrum-right">'+spec.right.label+'</span></div>';
        html += '<div class="spectrum-bar">';
        html += '<div class="spectrum-fill-left" style="width:'+pos+'%"></div>';
        html += '<div class="spectrum-fill-right" style="width:'+(100-pos)+'%"></div>';
        html += '<div class="spectrum-marker" style="left:0%" data-target="'+pos+'%"></div>';
        html += '</div>';
        html += '<div class="spectrum-desc">'+desc+'</div>';
        html += '</div>';
    });
    list.innerHTML = html;
    // 延迟动画
    setTimeout(function() {
        document.querySelectorAll('.spectrum-marker').forEach(function(m, i) {
            setTimeout(function() {
                m.style.left = m.dataset.target;
            }, i * 120);
        });

}

function renderTopTraits() {
    var cards = document.getElementById('traitCards');
    if (!cards) return;
    // 计算每个特质的得分
    var ranked = traitDefinitions.map(function(t) {
        var score = scores[t.key] || 0;
        // 归一化到百分比
        var pct = Math.max(10, Math.min(98, Math.round((score + 6) / 12 * 100)));
        // 根据百分比选择描述
        var desc = pct >= 75 ? t.high : t.mid;
        return { name: t.name, icon: t.icon, desc: desc, score: score, pct: pct };
    }).sort(function(a, b) { return b.score - a.score; });
    var top3 = ranked.slice(0, 3);
    var html = '';
    top3.forEach(function(t) {
        html += '<div class="trait-card">';
        html += '<div class="trait-card-icon">'+t.icon+'</div>';
        html += '<div class="trait-card-body">';
        html += '<div class="trait-card-header"><span class="trait-card-name">'+t.name+'</span><span class="trait-card-pct">'+t.pct+'%</span></div>';
        html += '<div class="trait-card-desc">'+t.desc+'</div>';
        html += '</div></div>';
    });
    cards.innerHTML = html;
}

                T: '你热闹但有分寸——你爱开玩笑，但你知道底线在哪；你喜欢闹，但你不会真的让谁下不来台。你心里清楚谁是真正的朋友，也知道该怎么对待不同的人。你看起来大大咧咧，其实心里比谁都有数。对你来说，让人开心不是一味地讨好，是让每个人都被尊重。',
                F: '你的快乐是建立在别人的快乐之上的——你会注意到每个人的情绪，会想办法让内向的人也融入进来，会在有人不开心的时候第一时间去安慰。你天生就想让每个人都舒服、都开心。你最怕的就是冷场和尴尬，你愿意做那个主动暖场的人。'
            },
            JP: {
                J: '你组织活动特别靠谱——提前安排好一切，考虑到每个人的需求，有你在大家都玩得特别安心。你喜欢有计划的聚会，知道要玩什么、什么时候去、都有谁，这样你才能做好准备。对你来说，快乐是可以安排的——提前做好功课，到时候尽情享受。',
                P: '你即兴的时候最有魅力——想到什么就玩什么，说走就走，说玩就玩。你不喜欢定计划，你觉得计划赶不上变化，随兴所至才最有意思。你总是能在任何情境下找到乐子，把任何聚会都变得好玩。对你来说，快乐是不期而遇的——计划之外的，才是最难忘的。'
            }
        }
    };
    
    var c = data[careerKey];
    if (!c) return '<p>你的MBTI与这个职业有独特的化学反应，让你在游戏世界中展现出与众不同的一面。</p>';
    
    var dims = [
        { key: 'EI', letter: EI, title: '能量来源' },
        { key: 'SN', letter: SN, title: '感知方式' },
        { key: 'TF', letter: TF, title: '判断方式' },
        { key: 'JP', letter: JP, title: '生活态度' }
    ];
    
    var html = '';
    dims.forEach(function(d, i) {
        var text = c[d.key] && c[d.key][d.letter];
        if (!text) return;
        if (i > 0) html += '<div class="mbti-dim-divider"></div>';
        html += '<div class="mbti-dimension">' +
            '<div class="mbti-dim-title"><span class="mbti-dim-badge">'+d.letter+'</span>'+d.title+'</div>' +
            '<p class="mbti-dim-text">'+text+'</p>' +
            '</div>';
    });
    
    return html;
}

function drawRadarChart() {
    var canvas = document.getElementById('radarCanvas'); if (!canvas) return;
    var ctx = canvas.getContext('2d'), cx = 150, cy = 150, R = 100;
    var dims = [{ label: '剧情', key: 'story' },{ label: '视觉', key: 'visual' },{ label: '探索', key: 'explore' },{ label: '治愈', key: 'healing' },{ label: '解谜', key: 'puzzle' },{ label: '战斗', key: 'combat' },{ label: '羁绊', key: 'bonding' },{ label: '氛围', key: 'atmosphere' }];
    ctx.clearRect(0, 0, 300, 300);
    for (var r = 1; r <= 4; r++) { ctx.beginPath(); var rr = (R/4)*r; dims.forEach(function(d, i) { var a = (Math.PI*2/dims.length)*i-Math.PI/2, x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }); ctx.closePath(); ctx.strokeStyle='rgba(155,138,189,0.15)'; ctx.lineWidth=1; ctx.stroke(); }
    dims.forEach(function(d, i) { var a=(Math.PI*2/dims.length)*i-Math.PI/2; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*R, cy+Math.sin(a)*R); ctx.strokeStyle='rgba(155,138,189,0.12)'; ctx.lineWidth=1; ctx.stroke(); });
    ctx.beginPath(); dims.forEach(function(d, i) { var raw=scores[d.key]||0, pct=Math.max(0.08,Math.min(1,(raw+6)/12)), a=(Math.PI*2/dims.length)*i-Math.PI/2, x=cx+Math.cos(a)*R*pct, y=cy+Math.sin(a)*R*pct; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }); ctx.closePath();
    var grad=ctx.createRadialGradient(cx,cy,0,cx,cy,R); grad.addColorStop(0,'rgba(155,138,189,0.4)'); grad.addColorStop(1,'rgba(155,138,189,0.1)'); ctx.fillStyle=grad; ctx.fill(); ctx.strokeStyle='#9b8acd'; ctx.lineWidth=2; ctx.stroke();
    ctx.font='12px PingFang SC,Microsoft YaHei,sans-serif'; ctx.fillStyle='#665c72'; ctx.textAlign='center'; ctx.textBaseline='middle';
    dims.forEach(function(d, i) { var a=(Math.PI*2/dims.length)*i-Math.PI/2; ctx.fillText(d.label, cx+Math.cos(a)*(R+22), cy+Math.sin(a)*(R+22)); });
}

function shareResult(typeKey) {
    var t = playerTypes[typeKey], shareUrl = 'https://her-len.pages.dev/', text = '我在 Her Lens 测出我的玩家职业是「'+t.name+'」！'+t.tagline+'\n\n来测测你在游戏世界里是什么职业 → '+shareUrl;
    if (navigator.share) { navigator.share({ title: '我是'+t.name+'！来测测你的游戏人格', text: text, url: shareUrl }).catch(function() { fallback(text); }); } else { fallback(text); }
}
function fallback(text) { if (navigator.clipboard) { navigator.clipboard.writeText(text).then(function() { showToast('✅ 分享文案已复制到剪贴板！'); }).catch(function() { showToast('请截图分享给好友'); }); } else { showToast('请截图分享给好友'); } }
function showToast(msg) { var t=document.createElement('div'); t.style.cssText='position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:rgba(60,30,80,0.9);color:#fff;padding:0.7rem 1.5rem;border-radius:24px;font-size:0.9rem;z-index:99999;animation:fadeInUp 0.3s ease;backdrop-filter:blur(10px);'; t.textContent=msg; document.body.appendChild(t); setTimeout(function(){t.style.transition='0.3s';t.style.opacity='0';t.style.transform='translateX(-50%) translateY(10px)';setTimeout(function(){t.remove();},300);},2500); }
